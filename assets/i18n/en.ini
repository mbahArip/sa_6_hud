# ==============================================================================
# 6HUD English localisation
# ==============================================================================
# One flat key=value per line. printf placeholders (%.1f, %.0f) must be kept
# exactly as they appear, or the formatted distance strings break.
#
# The language is chosen from the game's own setting, so there is nothing to
# configure here. Missing keys fall back to English.

[i18n]
GPS_TURN_LEFT = Turn Left
GPS_TURN_RIGHT = Turn Right
GPS_BEAR_LEFT = Bear Left
GPS_BEAR_RIGHT = Bear Right
GPS_UTURN_LEFT = Make U-Turn Left
GPS_UTURN_RIGHT = Make U-Turn Right
GPS_CONTINUE = Continue

GPS_IN_KM = In %.1fkm
GPS_IN_M = In %.0fm
GPS_IN_MI = In %.2fmi
GPS_IN_FT = In %.0fft
GPS_NOW_M = 0m
GPS_NOW_FT = 0ft

VEHICLE_FALLBACK = Vehicle

MENU_TAB_RADAR = Radar
MENU_TAB_GPS = GPS
MENU_TAB_CARDS = Cards
MENU_TAB_SEARCH = Search
MENU_TAB_HEAT = Heat
MENU_TAB_SIRENS = Sirens
MENU_TAB_ARCS = Arcs/Snitch
MENU_TAB_LAYOUT = Layout
