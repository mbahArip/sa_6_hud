# [Minimap.Extension.VehicleFuel] Vehicle Fuel System
# ==============================================================================
[Minimap.Extension.VehicleFuel]
# Custom vehicle fuel consumption system and gauge integration
# Type: boolean
# Options: 0 = Disabled (infinite fuel), 1 = Enabled
# Default: 0
USE_VEHICLE_FUEL = 0

# Enable vehicle fuel consumption during active story missions
# Type: boolean
# Options: 0 = Disabled (infinite fuel during missions), 1 = Enabled
# Default: 0
USE_VEHICLE_FUEL_ON_MISSION = 0

# Fuel burn rate multiplier while engine is running and accelerating
# Type: float
# Range: 0.10 - 10.00
# Default: 1.00
VEHICLE_FUEL_CONSUMPTION = 1.00

