# Range: 20.0 - 150.0
# Default: 60.0
EXT_WANTED_SNITCH_RADIUS = 60.0

# Minimum run distance in meters a civilian flees in panic before stopping to call 911
# Type: float
# Range: 10.0 - 200.0
# Default: 50.0
EXT_WANTED_SNITCH_MIN_PANIC_RUN = 50.0

# Maximum run distance in meters a civilian flees in panic before stopping to call 911
# Type: float
# Range: 20.0 - 300.0
# Default: 150.0
EXT_WANTED_SNITCH_MAX_PANIC_RUN = 150.0

# ==============================================================================
# Modular HUD Positioning & Layout Settings
#
# Available Options:
# position_mode:
#   group : Stacked inside parent group flow container (recommended)
#   free  : Freely positioned on screen relative to pos_anchor
#
# group:
#   minimap      : Bottom-left radar card stack
#   status       : Top-left health/armor card stack
#   criminal     : Top-right weapon/money/wanted stack
#   notification : Dynamic transient alert stack
#
# group_index:
#   0, 1, 2, 3... : Order index inside parent group stack
#
# pos_anchor (Screen Anchor) & element_anchor (Element Self Anchor):
#   top-left      | top-center    | top-right
#   center-left   | center        | center-right
#   bottom-left   | bottom-center | bottom-right
#
# offset_x / offset_y:
#   offset_x : Cartesian X offset in screen pixels (+ moves right, - moves left)
#   offset_y : Cartesian Y offset in screen pixels (+ moves up, - moves down)
# ==============================================================================

[layout.radar]
# Position mode: group | free (Default: group)
position_mode = group
# Parent group: minimap | status | criminal | notification (Default: minimap)
group = minimap
# Stack ordering index within parent group (Default: 0)
group_index = 0
# Screen anchor point (Default: bottom-left)
pos_anchor = bottom-left
# Element anchor point (Default: bottom-left)
element_anchor = bottom-left
# Cartesian X offset in pixels (Default: 0.0)
offset_x = 0.0
# Cartesian Y offset in pixels (Default: 0.0)
offset_y = 0.0

