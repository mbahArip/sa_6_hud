USE_MONEY_UI = 1

# ==============================================================================
# [Minimap.Radar] Radar Shell & Minimap Perspective
# ==============================================================================
[Minimap.Radar]
# Master toggle for 6HUD custom minimap overlay
# Type: boolean
# Options: 0 = Disabled (vanilla radar restored), 1 = Enabled (6HUD radar active)
# Default: 1
USE_RADAR = 1

# Global size multiplier for radar dimensions
# Type: float
# Range: 0.50 - 2.00
# Default: 1.00
RADAR_SIZE_SCALE = 1.00

# Controls radar visibility when CJ is on foot
# Type: boolean
# Options: 0 = Auto-hide on foot (reveals on SHOW_HUD_KEY, combat, wanted level, or active GPS) | 1 = Always visible on foot
# Default: 0
SHOW_ON_FOOT = 0

# In-game clock display format inside radar frame
# Type: enum
# Options: 12H_FORMAT (e.g. "7:29 am") | 24H_FORMAT (e.g. "07:29")
# Default: 12H_FORMAT
GAME_CLOCK_FORMAT = 12H_FORMAT

# Zoom-out magnification multiplier applied while holding MAP_PEEK_KEY
# Type: float
# Range: 1.00 - 4.00
# Default: 1.50
RADAR_ZOOM_MULTIPLIER = 1.50

# Radar zoom multiplier applied inside tight alleys, garages, or enclosed spaces
# Type: float
# Range: 0.50 - 1.50
# Default: 0.90
CLOSED_SPACE_ZOOM_MULTIPLIER = 0.90

# Enable dynamic camera height scaling when flying or climbing to high altitudes
# Type: boolean
# Options: 0 = Disabled, 1 = Enabled
# Default: 1
USE_ALTITUDE_ZOOM = 1

# Maximum zoom-out multiplier applied at peak altitude
# Type: float
# Range: 1.00 - 3.00
# Default: 1.50
ALTITUDE_ZOOM_MULTIPLIER = 1.50

# Minimum player Z height in meters before altitude zoom begins expanding
# Type: float
# Range: 0.0 - 100.0
# Default: 20.0
MIN_ALTITUDE = 20.0

# Player Z height in meters where maximum altitude zoom multiplier is reached
# Type: float
# Range: 50.0 - 1000.0
# Default: 250.0
MAX_ALTITUDE = 250.0

# Lock player elevation to flat 2D plane to prevent 3D perspective distortion
# Type: boolean
# Options: 0 = 3D relative elevation, 1 = Locked flat 2D plane
# Default: 1
LOCK_PLAYER_ELEVATION = 1

# Radar master opacity percentage (map tiles and backdrop)
# Type: integer / float
# Range: 10 - 100
# Default: 65
RADAR_OPACITY = 65

# Experimental rendering of nearby 3D building/world geometry footprints on radar
# Type: boolean
# Options: 0 = Disabled, 1 = Enabled
# Default: 0
EXPERIMENTAL_SHOW_3D_OBJECTS = 0

# Load modern high-resolution map tiles from assets/radar/map/ if available
# Type: boolean
# Options: 0 = Load vanilla TXD map tiles, 1 = Load custom PNG map tiles
# Default: 1
USE_CUSTOM_MAP_TILE = 1

# Also draw the custom PNG tiles on the ESC pause map (requires USE_CUSTOM_MAP_TILE = 1)
# Transparent water areas are filled with minimap.radar.sea / sea_night from colors.ini
# Type: boolean
# Options: 0 = Leave pause map tiles to the game, 1 = Draw custom PNG tiles on pause map
# Default: 1 (follows USE_CUSTOM_MAP_TILE when omitted)
USE_CUSTOM_PAUSE_MAP = 1

