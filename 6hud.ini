# Range: 0.10 - 1.00
# Default: 1.00 (100%)
VEHICLE_FUEL_RNG_MAX = 1.00

# Base price per 10% of tank at a gas pump. Prices are never shown in game, only
# deducted. A nearly empty car pays ten of these, a 95% full one pays one.
# Type: float
# Range: 0.00 - 1000.00
# Default: 1.50
BASE_PRICE = 1.50

# Price multiplier outside the three cities (countryside and desert stations,
# representing the transport surcharge). 1.00 disables the surcharge.
# Type: float
# Range: 1.00 - 10.00
# Default: 1.50
FUEL_CS_PRICE_MULTIPLIER = 1.50

# Repair price at zero damage. The price scales linearly up to REPAIR_PRICE_MAX
# as the vehicle approaches wrecked. Hidden from the player, deducted on confirm.
# Type: float
# Range: 0.00 - 10000.00
# Default: 10.00
REPAIR_PRICE_MIN = 10.00

# Repair price at full damage (engine health at or below 250)
# Type: float
# Range: 0.00 - 10000.00
# Default: 400.00
REPAIR_PRICE_MAX = 400.00

# HESOYAM (money/armour/health) cheat also refills the current vehicle's tank
# Type: boolean
# Options: 0 = Disabled (cheat leaves fuel alone), 1 = Enabled (cheat fills tank)
# Default: 0
CHEAT_REFILL_FUEL = 0

# Seconds of animation per 1% of tank refilled. A 40% fill takes 10s at 0.25.
# Set to 0.00 to refill instantly.
# Type: float
# Range: 0.00 - 10.00
# Default: 0.25
REFUEL_DURATION_PER_PCT = 0.25

# Seconds of animation per 10% of vehicle health repaired
# Set to 0.00 to repair instantly.
# Type: float
# Range: 0.00 - 10.00
# Default: 1.00
REPAIR_DURATION_PER_10PCT = 1.00

# Maximum distance in metres from the vehicle origin to a pump centre before the
# services prompt appears. Larger values let you trigger without nosing right up.
# Type: float
# Range: 0.50 - 30.00
# Default: 4.00
REFUEL_RADIUS = 4.00

