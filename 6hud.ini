# ==============================================================================
# 6HUD - Modern Minimalist Radar & Dynamic HUD Configuration
# ==============================================================================

# ==============================================================================
# [KEYS] Keyboard & Gamepad Binds
# ==============================================================================
# Every action accepts an optional gamepad button alongside its keyboard key.
# Set a *_PAD value to NONE to keep the action keyboard-only.
[KEYS]
# Key to reveal/refresh hidden HUD elements and information cards
# Type: string
# Options: single character (J) | VK name (VK_F5) | hex code (0x74)
# Default: J
SHOW_HUD_KEY = J

# Gamepad button for the same action
# Type: enum
# Options: NONE | A | B | X | Y | LB | LT | RB | RT | START | BACK
#          | DUP | DDOWN | DLEFT | DRIGHT
# Default: NONE
SHOW_HUD_PAD = NONE

# Key to hold for zooming out the radar for a tactical navigation overview
# Type: string
# Options: single character (K) | VK name (VK_F5) | hex code (0x74)
# Default: K
MAP_PEEK_KEY = K

# Gamepad button for the peek zoom-out
# Type: enum
# Options: NONE | A | B | X | Y | LB | LT | RB | RT | START | BACK
#          | DUP | DDOWN | DLEFT | DRIGHT
# Default: NONE
MAP_PEEK_PAD = NONE

# Key to show/refresh the information cards on demand
# Type: string
# Options: single character (J) | VK name (VK_F5) | hex code (0x74)
# Default: J
INFO_KEY = J

# Gamepad button for the information card refresh
# Type: enum
# Options: NONE | A | B | X | Y | LB | LT | RB | RT | START | BACK
#          | DUP | DDOWN | DLEFT | DRIGHT
# Default: NONE
INFO_KEY_PAD = NONE

# --- Gas pump services ---
# Hold this near a pump while stopped to open the Refuel / Repair list
# Type: string
# Options: single character (SPACE) | VK name (VK_F5) | hex code (0x74)
# Default: SPACE
SERVICE_KEY = SPACE

# Gamepad button for opening the services list
# Type: enum
# Options: NONE | A | B | X | Y | LB | LT | RB | RT | START | BACK
#          | DUP | DDOWN | DLEFT | DRIGHT
# Default: LB
SERVICE_PAD = LB

# Confirm the highlighted service (prices are hidden, deducted silently)
# Type: string
# Default: VK_RETURN
SERVICE_SELECT_KEY = VK_RETURN

# Gamepad button to confirm the highlighted service
# Type: enum
# Default: A
SERVICE_SELECT_PAD = A

# Close the services list and return to gameplay
# Type: string
# Default: F
SERVICE_BACK_KEY = F

# Gamepad button to close the services list
# Type: enum
# Default: Y
SERVICE_BACK_PAD = Y

# Move the selection up
# Type: string
# Default: VK_UP
SERVICE_UP_KEY = VK_UP

# Gamepad button to move the selection up
# Type: enum
# Default: DUP
SERVICE_UP_PAD = DUP

# Move the selection down
# Type: string
# Default: VK_DOWN
SERVICE_DOWN_KEY = VK_DOWN

# Gamepad button to move the selection down
# Type: enum
# Default: DDOWN
SERVICE_DOWN_PAD = DDOWN

# ==============================================================================
# [UI] Master Toggles Per HUD Surface
# ==============================================================================
# Each switch enables or disables one HUD surface as a whole. Per-module
# behaviour settings live under their own sections further down.
[UI]
# Draw the 6HUD minimap radar instead of the vanilla radar
# Type: bool
# Options: 1 = enabled | 0 = disabled
# Default: 1
USE_RADAR = 1

# GPS road ribbon routing and turn-by-turn navigation
# Type: bool
# Options: 1 = enabled | 0 = disabled
# Default: 1
USE_GPS_NAV = 1

# Place / zone name information card
# Type: bool
# Options: 1 = enabled | 0 = disabled
# Default: 1
USE_PLACE_INFO = 1

# Vehicle name and class information card
# Type: bool
# Options: 1 = enabled | 0 = disabled
# Default: 1
USE_VEH_INFO = 1

# Wanted level stars
# Type: bool
# Options: 1 = enabled | 0 = disabled
# Default: 1
USE_WANTED_LEVEL = 1

# Top-right weapon icon and ammo counter
# Type: bool
# Options: 1 = enabled | 0 = disabled
# Default: 1
USE_WEAPON = 1

# Top-right money counter and telemetry gauge
# Type: bool
# Options: 1 = enabled | 0 = disabled
# Default: 1
USE_MONEY = 1

# ==============================================================================
# [EXT] Extension Modules
# ==============================================================================
# Optional gameplay extensions. Disabled modules cost nothing: their game-code
# hooks are not installed until they are turned on.
[EXT]
# Vehicle fuel consumption and gauge
# Type: bool
# Options: 1 = enabled | 0 = disabled
# Default: 0
USE_FUEL = 0

# Hold-to-boost controllable nitrous
# Type: bool
# Options: 1 = enabled | 0 = disabled
# Default: 0
USE_NITRO_BOOST = 0

# Outer heat area shown after the search area expires
# Type: bool
# Options: 1 = enabled | 0 = disabled
# Default: 0
USE_HEAT_AREA = 0

# Inner wanted search area around the last known position
# Type: bool
# Options: 1 = enabled | 0 = disabled
# Default: 0
USE_SEARCH_AREA = 0

# Criminal profile heat badges (identity, vehicle, clothing, gun)
# Type: bool
# Options: 1 = enabled | 0 = disabled
# Default: 0
USE_CRIMINAL_PROFILE = 0

# Civilian witness (snitch) system that calls 911 on you
# Type: bool
# Options: 1 = enabled | 0 = disabled
# Default: 0
USE_SNITCH_SYSTEM = 0

# Screen-edge police lightbar indicator
# Type: bool
# Options: 1 = enabled | 0 = disabled
# Default: 0
USE_SIREN_INDICATOR = 0

# On-foot directional police threat arcs
# Type: bool
# Options: 1 = enabled | 0 = disabled
# Default: 0
USE_ARC_INDICATOR = 0

# ==============================================================================
# [Global] System Settings
# ==============================================================================
[Global]
# Measurement unit for speed and distance across all HUD modules
# Type: enum
# Options: METRIC (km/h, m, km) | IMPERIAL (mph, ft, mi)
# Default: METRIC
GAME_UNIT = METRIC

# Inactivity duration in seconds before auto-hiding adaptive HUD cards and modules
# Type: float
# Range: 0.50 - 60.00
# Default: 4.00
UI_IDLE_TIMEOUT = 4.00

# Blur radius intensity multiplier for acrylic frosted glass shader behind HUD elements
# Type: float
# Range: 0.00 (disabled/sharp) - 5.00 (heavy blur)
# Default: 1.50
BACKDROP_BLUR_INTENSITY = 1.50

# Downscale factor for the live D3D9 blur shader passes (performance vs sharpness)
# Type: enum / integer
# Options: 1 = Low (8x downsample, fastest), 2 = Medium (4x downsample), 3 = High (2x downsample), 4 = Ultra (1x native resolution)
# Range: 1 - 4
# Default: 3
BACKDROP_BLUR_QUALITY = 3

# ==============================================================================
# [weapon] Weapon Display
# ==============================================================================
[WEAPON]
# Keep the weapon HUD visible permanently instead of auto-hiding it after
# UI_IDLE_TIMEOUT seconds without weapon activity
# Type: boolean
# Options: 0 = auto-hide after idle timeout | 1 = always visible
# Default: 0
ALWAYS_SHOW = 0

[weapon]
# Master toggle for custom 6HUD weapon display in top-right corner
# Type: boolean
# Options: 0 = Disabled (vanilla weapon HUD), 1 = Enabled (6HUD weapon HUD)
# Default: 1
USE_WEAPON_UI = 1

# Ammo counter display format
# Type: enum
# Options: TOTAL_AMMO (clip / total reserve ammo, e.g. 30/120) | TOTAL_CLIP (clip / magazine count, e.g. 30/4)
# Default: TOTAL_CLIP
WEAPON_UI_TOTAL_AMMO_TYPE = TOTAL_CLIP

# ==============================================================================
# [MONEY] Cash Display
# ==============================================================================
[MONEY]
# Keep the money counter visible permanently instead of auto-hiding it after
# UI_IDLE_TIMEOUT seconds without a balance change
# Type: boolean
# Options: 0 = auto-hide after idle timeout | 1 = always visible
